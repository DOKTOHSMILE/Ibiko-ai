name: CI

# Why this exists:
#   The Gradle build (especially the CMake/llama.cpp native compile) needs
#   more RAM than a phone has, so it OOMs on device (daemon killed, "A problem
#   occurred configuring root project"). Everything expensive runs here
#   instead: lint, Kotlin unit tests and the native build.
#
#   There is no gradlew in the repository, so the first step of every job
#   generates one with the same Gradle version setup-gradle provisions.
#
#   Which jobs are gates:
#     * unit tests  - blocking. These are the ones that fail on a bad change.
#     * debug build - blocking. Kotlin + the llama.cpp native compile.
#     * release build - blocking. The same with R8 shrinking (app/proguard-rules.pro), which debug never runs.
#     * Android lint - advisory (continue-on-error) while the report on main
#       is not proven clean; it uploads its HTML report either way, so a new
#       problem can be read without stopping every push.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # nightly, so a dependency breaking us shows up without a push
    - cron: '30 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  unit-test:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Unit tests (crew)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build debug APK (Kotlin + llama.cpp via CMake)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ibiko-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # 24 hours: APKs are big, GitHub storage fills fast
          retention-days: 1
  release-build:
    name: Build release APK (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The release build shrinks and obfuscates with R8 (app/proguard-rules.pro); the debug build never runs it,
    # so a missing keep rule would only show on a phone.
    # It is signed, so it installs: with the key in the repository's secrets (IBIKO_KEYSTORE_B64, the keystore in
    # base64; IBIKO_KEYSTORE_PASSWORD; IBIKO_KEY_ALIAS; IBIKO_KEY_PASSWORD), or, without them, with a key made for
    # this run (it installs, but an update over it needs the app uninstalled first).
    # A push to main (and a manual run) publishes it as a GitHub release with Ibiko.apk attached, the newest marked
    # Latest: https://github.com/<owner>/<repo>/releases/latest/download/Ibiko.apk is always the newest build.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.IBIKO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.IBIKO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IBIKO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.IBIKO_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/ibiko-release.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            {
              echo "IBIKO_KEYSTORE=$KS"
              echo "IBIKO_KEYSTORE_PASSWORD=$KS_PASS"
              echo "IBIKO_KEY_ALIAS=$KEY_ALIAS"
              echo "IBIKO_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "kind=saved" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No IBIKO_KEYSTORE_B64 secret: signing with a key made for this run. It installs, but updating over it needs an uninstall."
            keytool -genkeypair -keystore "$KS" -storepass ibiko-ci -keypass ibiko-ci -alias ibiko -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Ibiko CI" -noprompt
            {
              echo "IBIKO_KEYSTORE=$KS"
              echo "IBIKO_KEYSTORE_PASSWORD=ibiko-ci"
              echo "IBIKO_KEY_ALIAS=ibiko"
              echo "IBIKO_KEY_PASSWORD=ibiko-ci"
            } >> "$GITHUB_ENV"
            echo "kind=temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (R8 + llama.cpp via CMake)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the signature and name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Ibiko.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs dist/Ibiko.apk | head -3
          echo "VERSION=$(sed -nE 's/^ *versionName "([^"]+)".*/\1/p' app/build.gradle | head -1)" >> "$GITHUB_ENV"
          ls -la dist/Ibiko.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ibiko-release-apk
          path: dist/Ibiko.apk
          retention-days: 7

      - name: Publish as a GitHub release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Ibiko ${{ env.VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Ibiko.apk
          body: |
            Ibiko ${{ env.VERSION }}, built from ${{ github.sha }}.

            **Install:** open this page on the phone, tap **Ibiko.apk**, then open the download and allow installs from your browser if Android asks.
            The newest build is always at `releases/latest/download/Ibiko.apk`.

            Signed with ${{ steps.key.outputs.kind == 'saved' && 'the saved release key: it updates the installed app in place.' || 'a key made for this build only (no signing secret is set): uninstall the app before installing it.' }}

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 7
